name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format, data and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Git hooks aren't needed on the CI machine
      HUSKY: 0
      STORYBOOK_DISABLE_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Validate data files
        run: npm run validate:data

      - name: Build site
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook
