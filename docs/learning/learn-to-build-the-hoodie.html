<style id="app-style">
  /* Palette from The Hoodie LB's own "Warm & Cozy" tokens (app/globals.css) */
  :root {
    color-scheme: light;
    --ground: #faf7f2;
    --surface: #ffffff;
    --sunken: #f4ede2;
    --line: #ece0cf;
    --line-strong: #dfcdb3;
    --ink: #1a1a1a;
    --ink-2: #4f4f4f;
    --muted: #6d6d6d;
    --ember: #c75b2a;
    --ember-ink: #ac3c1e;
    --ember-wash: #fdf5ef;
    --ember-edge: #f4ccb1;
    --sage: #637456;
    --sage-ink: #4e5d44;
    --sage-wash: #f4f6f2;
    --sage-edge: #ccd4c5;
    --sand-ink: #9b6338;
    --sand-wash: #fdf8f3;
    --sand-edge: #f2dcc5;
    --font-sans: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      color-scheme: dark;
      --ground: #1b1815;
      --surface: #24201c;
      --sunken: #2c2722;
      --line: #3a332c;
      --line-strong: #4a4138;
      --ink: #f4ede2;
      --ink-2: #d2c7b8;
      --muted: #a69d91;
      --ember: #e5824d;
      --ember-ink: #eeab80;
      --ember-wash: #33201a;
      --ember-edge: #5a2e20;
      --sage: #a9b59f;
      --sage-ink: #a9b59f;
      --sage-wash: #1f241c;
      --sage-edge: #3f4a37;
      --sand-ink: #e8c49e;
      --sand-wash: #2b2219;
      --sand-edge: #5a4530;
    }
  }
  :root[data-theme='dark'] {
    color-scheme: dark;
    --ground: #1b1815;
    --surface: #24201c;
    --sunken: #2c2722;
    --line: #3a332c;
    --line-strong: #4a4138;
    --ink: #f4ede2;
    --ink-2: #d2c7b8;
    --muted: #a69d91;
    --ember: #e5824d;
    --ember-ink: #eeab80;
    --ember-wash: #33201a;
    --ember-edge: #5a2e20;
    --sage: #a9b59f;
    --sage-ink: #a9b59f;
    --sage-wash: #1f241c;
    --sage-edge: #3f4a37;
    --sand-ink: #e8c49e;
    --sand-wash: #2b2219;
    --sand-edge: #5a4530;
  }

  * {
    box-sizing: border-box;
  }
  [hidden] {
    display: none !important;
  }
  html {
    scroll-behavior: smooth;
  }
  @media (prefers-reduced-motion: reduce) {
    html {
      scroll-behavior: auto;
    }
    * {
      transition: none !important;
    }
  }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 1rem;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  h1,
  h2,
  h3 {
    margin: 0;
    text-wrap: balance;
  }
  p {
    margin: 0;
  }
  a {
    color: var(--ember-ink);
    text-underline-offset: 3px;
  }
  a:focus-visible,
  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible,
  select:focus-visible {
    outline: 2px solid var(--ember);
    outline-offset: 2px;
  }
  code,
  .mono {
    font-family: var(--font-mono);
    font-size: 0.86em;
  }
  code {
    background: var(--sunken);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0.04em 0.32em;
    overflow-wrap: anywhere;
  }

  .page {
    max-width: 60rem;
    margin: 0 auto;
    padding: 2.75rem 1.5rem 4rem;
    display: grid;
    gap: 2.75rem;
  }

  /* ---------- Header ---------- */
  .top {
    display: grid;
    gap: 1rem;
  }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .top h1 {
    font-size: clamp(2rem, 1.4rem + 2.4vw, 2.75rem);
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.05;
  }
  .lede {
    font-size: 1.15rem;
    color: var(--ink-2);
    max-width: 44rem;
  }
  .progress {
    display: grid;
    gap: 0.5rem;
    max-width: 36rem;
  }
  .progress-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .progress-count {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 0.95rem;
  }
  .progress-count b {
    font-size: 1.35rem;
    font-weight: 500;
  }
  .bar {
    height: 10px;
    border-radius: 999px;
    background: var(--sunken);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .bar > span {
    display: block;
    height: 100%;
    background: var(--sage);
    border-radius: 999px;
    transition: width 300ms ease;
  }
  .status {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }
  .status::before {
    content: '';
    width: 0.5rem;
    height: 0.5rem;
    border-radius: 50%;
    background: var(--line-strong);
  }
  .status[data-state='saved']::before {
    background: var(--sage);
  }
  .status[data-state='saving']::before {
    background: var(--ember);
  }
  .status[data-state='error']::before {
    background: var(--ember-ink);
    border-radius: 1px;
  }

  /* ---------- Up next ---------- */
  .next {
    background: var(--ember-wash);
    border: 1px solid var(--ember-edge);
    border-radius: 12px;
    padding: 1.25rem 1.4rem;
    display: grid;
    gap: 0.6rem;
  }
  .next h2 {
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .next .task {
    color: var(--ink-2);
  }
  .next-actions {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    margin-top: 0.2rem;
  }

  /* ---------- Buttons ---------- */
  .btn {
    font: inherit;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    border-radius: 8px;
    padding: 0.45rem 0.9rem;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    text-decoration: none;
  }
  .btn:hover {
    border-color: var(--ink-2);
  }
  .btn.primary {
    background: var(--ember);
    border-color: var(--ember);
    color: #fff;
  }
  .btn.primary:hover {
    filter: brightness(1.06);
  }
  .btn.small {
    font-size: 0.8rem;
    padding: 0.25rem 0.6rem;
  }
  .btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  /* ---------- Sections ---------- */
  section.block {
    display: grid;
    gap: 1rem;
  }
  .block-head {
    display: grid;
    gap: 0.3rem;
  }
  .block-head h2 {
    font-size: 1.6rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .block-head p {
    color: var(--muted);
    max-width: 44rem;
  }

  /* ---------- Phase navigator ---------- */
  .phase-nav {
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    padding-bottom: 0.25rem;
  }
  .phase-nav a {
    flex: 0 0 auto;
    display: grid;
    gap: 0.3rem;
    min-width: 8.5rem;
    text-decoration: none;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.6rem 0.75rem;
  }
  .phase-nav a:hover {
    border-color: var(--line-strong);
  }
  .phase-nav .n {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--muted);
  }
  .phase-nav .t {
    font-size: 0.85rem;
    font-weight: 500;
    line-height: 1.25;
  }
  .phase-nav .bar {
    height: 5px;
  }

  /* ---------- Phases ---------- */
  .phase {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.5rem;
    display: grid;
    gap: 1.1rem;
    scroll-margin-top: 1rem;
  }
  .phase-head {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    gap: 0.25rem 1rem;
    align-items: baseline;
  }
  .phase-num {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--muted);
  }
  .phase-head h3 {
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: -0.015em;
  }
  .phase-meta {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .phase-goal {
    color: var(--ink-2);
    max-width: 46rem;
  }
  .phase.complete {
    border-color: var(--sage-edge);
  }
  .phase.complete .phase-meta {
    color: var(--sage-ink);
  }

  .lessons {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    border-top: 1px solid var(--line);
  }
  .lesson {
    display: grid;
    grid-template-columns: 1.6rem minmax(0, 1fr) auto;
    gap: 0.2rem 0.75rem;
    padding: 0.85rem 0;
    border-bottom: 1px solid var(--line);
    align-items: start;
  }
  .lesson input {
    width: 1.15rem;
    height: 1.15rem;
    margin: 0.2rem 0 0;
    accent-color: var(--sage);
    cursor: pointer;
  }
  .lesson label {
    font-weight: 600;
    cursor: pointer;
  }
  .lesson .why {
    color: var(--ink-2);
    font-size: 0.93rem;
  }
  .lesson .do {
    font-size: 0.9rem;
    color: var(--ink-2);
    display: flex;
    gap: 0.5rem;
    align-items: baseline;
  }
  .lesson .do b {
    flex: 0 0 auto;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--sand-ink);
    background: var(--sand-wash);
    border: 1px solid var(--sand-edge);
    border-radius: 999px;
    padding: 0.05rem 0.45rem;
  }
  .lesson .body {
    display: grid;
    gap: 0.3rem;
  }
  .lesson.done label {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-color: var(--line-strong);
  }
  .lesson .explain {
    align-self: center;
  }

  .phase-foot {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
    gap: 1rem 1.5rem;
  }
  .mini-label {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.35rem;
  }
  .resources {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 0.3rem;
    font-size: 0.92rem;
  }
  .checkpoint {
    background: var(--sage-wash);
    border: 1px solid var(--sage-edge);
    border-radius: 10px;
    padding: 0.8rem 0.95rem;
    font-size: 0.93rem;
  }
  .checkpoint .mini-label {
    color: var(--sage-ink);
  }
  .notes {
    display: grid;
    gap: 0.5rem;
  }
  .notes textarea {
    width: 100%;
    min-height: 5.5rem;
    resize: vertical;
    font: inherit;
    font-size: 0.93rem;
    line-height: 1.5;
    color: var(--ink);
    background: var(--ground);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    padding: 0.6rem 0.7rem;
  }
  .notes-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .notes-row .hint {
    font-size: 0.8rem;
    color: var(--muted);
  }

  /* ---------- Tutor ---------- */
  .tutor {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.4rem;
    display: grid;
    gap: 0.9rem;
  }
  .tutor-controls {
    display: grid;
    gap: 0.6rem;
  }
  .tutor select,
  .tutor textarea {
    font: inherit;
    font-size: 0.93rem;
    color: var(--ink);
    background: var(--ground);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    padding: 0.5rem 0.65rem;
    width: 100%;
  }
  .tutor textarea {
    min-height: 4.5rem;
    resize: vertical;
  }
  .tutor-actions {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .tutor-actions .hint {
    font-size: 0.8rem;
    color: var(--muted);
  }
  .answer {
    border-top: 1px solid var(--line);
    padding-top: 0.9rem;
    display: grid;
    gap: 0.7rem;
    font-size: 0.97rem;
    max-width: 46rem;
  }
  .answer pre {
    margin: 0;
    background: var(--sunken);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.75rem 0.9rem;
    overflow-x: auto;
    font-size: 0.85rem;
    line-height: 1.5;
  }
  .answer pre code {
    background: none;
    border: 0;
    padding: 0;
  }
  .answer .thinking {
    color: var(--muted);
    font-style: italic;
  }

  /* ---------- Tips & glossary ---------- */
  .tips {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr));
    gap: 0;
    border-top: 1px solid var(--line);
  }
  .tip {
    padding: 0.9rem 1rem 0.9rem 0;
    border-bottom: 1px solid var(--line);
    display: grid;
    gap: 0.25rem;
  }
  .tip h3 {
    font-size: 1rem;
    font-weight: 600;
  }
  .tip p {
    color: var(--ink-2);
    font-size: 0.93rem;
  }
  .glossary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
    gap: 0.8rem 1.5rem;
    margin: 0;
  }
  .glossary div {
    display: grid;
    gap: 0.15rem;
  }
  .glossary dt {
    font-weight: 600;
  }
  .glossary dd {
    margin: 0;
    color: var(--ink-2);
    font-size: 0.92rem;
  }

  footer {
    font-size: 0.8rem;
    color: var(--muted);
    border-top: 1px solid var(--line);
    padding-top: 1.1rem;
  }

  @media (max-width: 40rem) {
    .page {
      padding: 2rem 1rem 3rem;
      gap: 2.25rem;
    }
    .phase {
      padding: 1.1rem;
    }
    .phase-head {
      grid-template-columns: minmax(0, 1fr);
    }
    .lesson {
      grid-template-columns: 1.6rem minmax(0, 1fr);
    }
    .lesson .explain {
      grid-column: 2;
      justify-self: start;
    }
  }
</style>

<main id="app" class="page">
  <header class="top">
    <div class="eyebrow">Your web development course · built around The Hoodie LB</div>
    <h1>Learn to Build The Hoodie</h1>
    <p class="lede">

    </p>
  </header>
</main>

  const esc = (s) =>
    String(s).replace(
      /[&<>"']/g,
      (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
    );
  const fmt = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
  const byId = (id) => ALL.find((l) => l.id === id);

  function normalize(s) {
    return {
      done: s && s.done && typeof s.done === 'object' ? s.done : {},
      notes: s && s.notes && typeof s.notes === 'object' ? s.notes : {},
      updated: (s && s.updated) || null,
    };
  }
  const sameContent = (a, b) =>
    JSON.stringify([a.done, a.notes]) === JSON.stringify([b.done, b.notes]);

  let embedded;
  try {
    embedded = normalize(JSON.parse(document.getElementById('learn-state').textContent));
  } catch {
    embedded = normalize(null);
  }
  let state = normalize(JSON.parse(JSON.stringify(embedded)));

  /* Changes from a save that didn't land before the page reloaded */
  let resumeAttempts = 0,
    dirty = false;
  const pendingRaw = ss((s) => s.getItem(PENDING_KEY));
  if (pendingRaw) {
    try {
      const p = JSON.parse(pendingRaw);
      const ps = normalize(p.state);
      if (!sameContent(ps, embedded) && (p.attempts || 0) < 2) {
        state = ps;
        resumeAttempts = p.attempts || 0;
        dirty = true;
      } else ss((s) => s.removeItem(PENDING_KEY));
    } catch {
      ss((s) => s.removeItem(PENDING_KEY));
    }

            .join('') +
          '</ul></div>' +
          '<div class="checkpoint"><div class="mini-label">Checkpoint: you’re ready to move on when…</div>' +
          fmt(p.checkpoint) +
          '</div>' +
          '<div class="notes"><label class="mini-label" for="notes-' +
          p.id +
          '">My notes: explain it in your own words</label><textarea id="notes-' +
          p.id +
          '" data-notes="' +
          p.id +
          '" placeholder="What I learned, what confused me, questions to ask…"></textarea>' +
          '<div class="notes-row"><button class="btn small" type="button" data-save-notes="' +
          p.id +
          '">Save notes</button><span class="hint" data-notes-hint="' +
          p.id +
          '"></span></div></div>' +
          '</div>' +
          '</section>',
      ).join('') +
      '<section class="block" aria-labelledby="tips-h"><div class="block-head"><h2 id="tips-h">How to learn this well</h2><p>Advice from your teacher. Come back to it when motivation dips.</p></div>' +
      '<div class="tips">' +
      TIPS.map(
        (t) => '<div class="tip"><h3>' + esc(t.t) + '</h3><p>' + fmt(t.d) + '</p></div>',
      ).join('') +
      '</div></section>' +
      '<section class="block" aria-labelledby="gloss-h"><div class="block-head"><h2 id="gloss-h">Words you’ve already met</h2><p>Terms from setting up your repo, in plain English.</p></div>' +
      '<dl class="glossary">' +
      GLOSSARY.map((g) => '<div><dt>' + esc(g.t) + '</dt><dd>' + fmt(g.d) + '</dd></div>').join(
        '',
      ) +
      '</dl></section>' +
      '<footer>Your ticks and notes are saved into this page, so they follow you to any device where you open it. All resources listed are free.</footer>';

    for (const p of PHASES) {
      const ta = document.getElementById('notes-' + p.id);
      if (ta) ta.value = state.notes[p.id] || '';
    }
    const nl = nextLesson();
    if (nl) document.getElementById('tutor-lesson').value = nl.id;
    refresh();
  }

  function refresh() {
    const n = doneCount(),
      pct = Math.round((n / TOTAL) * 100);
    document.getElementById('done-n').textContent = n;
    document.getElementById('done-pct').textContent = pct;
    document.getElementById('done-bar').style.width = pct + '%';
    for (const p of PHASES) {
      const d = phaseDone(p),
        w = Math.round((d / p.lessons.length) * 100) + '%';
      document.querySelector('[data-phase-count="' + p.id + '"]').textContent =
        d + '/' + p.lessons.length;
      document.querySelector('[data-nav-count="' + p.id + '"]').textContent =
        d + '/' + p.lessons.length;
      document.querySelector('[data-nav-bar="' + p.id + '"]').style.width = w;
      document.getElementById('phase-' + p.id).classList.toggle('complete', d === p.lessons.length);
    }
    for (const l of ALL) {
      const cb = document.getElementById('cb-' + l.id);
      cb.checked = !!state.done[l.id];
      cb.disabled = mode === 'readonly';
      document
        .querySelector('[data-row="' + l.id + '"]')
        .classList.toggle('done', !!state.done[l.id]);
    }
    document.querySelectorAll('[data-notes]').forEach((t) => {
      t.readOnly = mode === 'readonly';
    });
    document.querySelectorAll('[data-save-notes]').forEach((b) => {
      b.hidden = mode === 'readonly';
    });
    const nl = nextLesson(),
      next = document.getElementById('next');
    next.innerHTML = nl
      ? '<div class="eyebrow">Up next · Phase ' +
        nl.phaseNo +
        ' of ' +
        PHASES.length +
        ': ' +
        esc(nl.phase.title) +
        '</div><h2>' +
        fmt(nl.title) +
        '</h2><p class="task"><b>Your task:</b> ' +
        fmt(nl.do) +
        '</p>' +
        '<div class="next-actions"><a class="btn primary" href="#phase-' +
        nl.phase.id +
        '">Go to lesson</a><button class="btn tutor-only" type="button" data-explain="' +
        nl.id +
        '" hidden>Explain it to me</button></div>'
      : '<div class="eyebrow">Course complete</div><h2>You finished every lesson.</h2><p class="task">Keep building The Hoodie: pick the next dead link on the site and turn it into a real page.</p>';
    document.querySelectorAll('.tutor-only').forEach((b) => {
      b.hidden = !sampleApi;
    });
    setStatus();
  }

  function setStatus(kind, text) {
    const el = document.getElementById('status');
    if (!el) return;
    const when = state.updated
      ? new Date(state.updated).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })
      : '';
    const map = {
      pending: ['idle', 'Connecting…'],
      artifact: ['saved', state.updated ? 'Saved · ' + when : 'Progress saves to this page'],
      local: ['saved', 'Saved in this browser only'],
      readonly: ['idle', 'Read-only view'],
    };
    const [s, t] = kind ? [kind, text] : map[mode];
    el.dataset.state = s;
    el.textContent = t;
  }

  /* ---------------- Saving ---------------- */
  function buildDocument(s) {
    const json = JSON.stringify(s).replace(/</g, '\\u003c');
    const S = 'script';
    return (
      '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Learn to Build The Hoodie</title>' +
      FONTS +
      '<style id="app-style">' +
      STYLE_SRC +
      '</style></head><body><main id="app" class="page"></main>' +
      '<' +
      S +
      ' type="application/json" id="learn-state">' +
      json +
      '</' +
      S +
      '>' +
      '<' +
      S +
      ' id="app-script">' +
      SELF_SRC +
      '</' +
      S +
      '></body></html>'
    );
  }

  const stash = (attempts) =>
    ss((s) => s.setItem(PENDING_KEY, JSON.stringify({ state, attempts })));

  function scheduleSave(delay) {
    if (mode === 'readonly') return;
    state.updated = new Date().toISOString();
    dirty = true;
    stash(resumeAttempts);
    if (mode === 'local') {
      ls((s) => s.setItem(LOCAL_KEY, JSON.stringify(state)));
      ss((s) => s.removeItem(PENDING_KEY));
      dirty = false;
      setStatus();
      return;
    }
    if (mode !== 'artifact') {
      setStatus('saving', 'Will save in a moment…');
      return;
    }
    clearTimeout(saveTimer);
    setStatus('saving', 'Saving…');
    saveTimer = setTimeout(publishNow, delay);
  }

  async function publishNow() {
    if (publishing) {
      saveTimer = setTimeout(publishNow, 1500);
      return;
    }
    if (!SELF_SRC || SELF_SRC.length < 2000) {
      goLocal();
      return;
    }
    publishing = true;
    ss((s) => s.setItem(SCROLL_KEY, String(window.scrollY)));
    stash(resumeAttempts + 1);
    try {
      await artifactApi.publish(buildDocument(state)); /* the view reloads to the new version */
    } catch (e) {
      publishing = false;
      const code = e && e.code;
      if (code === 'conflict') {
        setStatus('saving', 'Loading the latest version…');
        return;
      }
      if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required') {
        goReadonly();
        return;
      }
      if (
        code === 'capability_disabled' ||
        code === 'capability_removed' ||
        code === 'not_declared'
      ) {
        goLocal();
        return;
      }
      if (code === 'rate_limited') {
        setStatus('saving', 'Saving soon…');
        saveTimer = setTimeout(publishNow, 10000);
        return;
      }
      if (code === 'upstream_error' && !retried) {
        retried = true;
        saveTimer = setTimeout(publishNow, 1200 + Math.random() * 1500);
        return;
      }
      setStatus('error', 'Couldn’t save. Your changes are kept on this device.');
    }
  }

  function goLocal() {
    mode = 'local';
    const saved = ls((s) => s.getItem(LOCAL_KEY));
    if (saved && !dirty) {
      try {
        const l = normalize(JSON.parse(saved));
        if (!state.updated || (l.updated && l.updated > state.updated)) state = l;
      } catch {}
    }
    if (dirty) {
      ls((s) => s.setItem(LOCAL_KEY, JSON.stringify(state)));
      ss((s) => s.removeItem(PENDING_KEY));
      dirty = false;
    }
    render();
  }

  function goReadonly() {
    mode = 'readonly';
    state = normalize(JSON.parse(JSON.stringify(embedded)));
    ss((s) => s.removeItem(PENDING_KEY));
    dirty = false;
    render();
  }

  /* ---------------- Tutor ---------------- */
  let tutorCtl = null,
    tutorBusy = false;

  function md(text) {
    const parts = String(text).split(/```[a-zA-Z]*\n?/);
    return parts
      .map((chunk, i) => {
        if (i % 2 === 1) return '<pre><code>' + esc(chunk.replace(/\n$/, '')) + '</code></pre>';
        return chunk
          .split(/\n{2,}/)
          .filter((para) => para.trim())
          .map(
            (para) =>
              '<p>' +
              esc(para.trim())
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>') +
              '</p>',
          )
          .join('');
      })
      .join('');
  }

  function tutorPrompt(lesson, question) {
    const notes = (state.notes[lesson.phase.id] || '').slice(0, 800);
    return (
      'You are a patient, professional web development teacher. Your student is a complete beginner who learns by working on their own project, "The Hoodie LB": an e-commerce storefront built with Next.js 16 (App Router), React 19, TypeScript, Tailwind CSS 4, Zod, ESLint, Prettier, Husky and Storybook. ' +
      'Real files in it include app/layout.tsx, app/page.tsx, app/globals.css (design tokens), components/layout/Header.tsx, AnnouncementBar.tsx, MobileNav.tsx, components/ui/Button.tsx, types/product.ts, lib/api/products.ts, lib/schemas/product.ts and data/products.json.\n\n' +
      'Course phase ' +
      lesson.phaseNo +
      ' of 10: ' +
      lesson.phase.title +
      '.\nLesson: ' +
      lesson.title +
      '. Why it matters: ' +
      lesson.why +
      '\nThe lesson task in their project: ' +
      lesson.do +
      '\n' +
      (notes ? "Student's own notes for this phase: " + notes + '\n' : '') +
      '\nStudent asks: ' +
      question +
      '\n\n' +
      'Answer in plain, friendly English for someone who has never coded. Use a short everyday analogy if it helps, at most one small code example (under 15 lines, in a fenced code block), and connect it to their project files when relevant. ' +
      'End with one tiny exercise they can do in about 10 minutes. Keep it under 250 words, and use no headings.'
    );
  }

  function tutorCopy(code) {
    return (
      {
        rate_limited: 'You’ve asked a lot in a short time. Wait a minute, then ask again.',
        session_expired: 'Sign in to Claude again, then ask.',
        refused: 'The tutor can’t answer that one. Try asking it a different way.',
        empty_completion: 'No answer came back. Try a shorter question.',
        prompt_too_large: 'That question is too long. Shorten it and try again.',
      }[code] || 'The tutor couldn’t answer just now. Try again in a moment.'
    );
  }

  async function ask(kind) {
    if (!sampleApi || tutorBusy) return;
    const lesson = byId(document.getElementById('tutor-lesson').value) || nextLesson() || ALL[0];
    const qBox = document.getElementById('tutor-q');
    const question =
      kind === 'explain'
        ? 'Explain this lesson simply, as if I have never written code before.'
        : qBox.value.trim();
    if (!question) {
      qBox.focus();
      return;
    }
    const out = document.getElementById('tutor-out');
    const askBtn = document.getElementById('tutor-ask'),
      explainBtn = document.getElementById('tutor-explain'),
      stopBtn = document.getElementById('tutor-stop');
    tutorBusy = true;
    askBtn.disabled = true;
    explainBtn.disabled = true;
    stopBtn.hidden = false;
    out.hidden = false;
    out.innerHTML = '<p class="thinking">Thinking…</p>';
    tutorCtl = new AbortController();
    const opts = {
      signal: tutorCtl.signal,
      onText: ({ text }) => {
        out.innerHTML = md(text);
      },
    };
    if (kind !== 'explain') opts.cache = false;
    try {
      const { text, truncated } = await sampleApi(tutorPrompt(lesson, question), opts);
      out.innerHTML =
        md(text) +
        (truncated
          ? '<p class="thinking">The answer was cut short. Try a narrower question.</p>'
          : '');
    } catch (e) {
      const code = e && e.code;
      out.innerHTML = e && e.text ? md(e.text) : '';
      if (
        [
          'not_granted',
          'sampling_disabled',
          'not_declared',
          'capability_disabled',
          'capability_removed',
        ].includes(code)
      ) {
        sampleApi = null;
        document.getElementById('tutor').hidden = true;
        refresh();
      } else if (code !== 'cancelled') {
        out.insertAdjacentHTML('beforeend', '<p class="thinking">' + esc(tutorCopy(code)) + '</p>');
      }
      if (!out.innerHTML) out.hidden = true;
    } finally {
      tutorBusy = false;
      askBtn.disabled = false;
      explainBtn.disabled = false;
      stopBtn.hidden = true;
    }
  }

  /* ---------------- Events ---------------- */
  document.addEventListener('change', (e) => {
    const cb = e.target.closest && e.target.closest('input[data-lesson]');
    if (!cb) return;
    if (mode === 'readonly') {
      cb.checked = !!state.done[cb.dataset.lesson];
      return;
    }
    if (cb.checked) state.done[cb.dataset.lesson] = true;
    else delete state.done[cb.dataset.lesson];
    refresh();
    scheduleSave(1800);
  });

  document.addEventListener('input', (e) => {
    const ta = e.target.closest && e.target.closest('textarea[data-notes]');
    if (!ta || mode === 'readonly') return;
    state.notes[ta.dataset.notes] = ta.value;
    stash(resumeAttempts);
    const hint = document.querySelector('[data-notes-hint="' + ta.dataset.notes + '"]');
    if (hint) hint.textContent = 'Not saved yet';
  });

  document.addEventListener('click', (e) => {
    const t = e.target.closest ? e.target : null;
    if (!t) return;
    const saveBtn = t.closest('[data-save-notes]');
    if (saveBtn) {
      const id = saveBtn.dataset.saveNotes;
      state.notes[id] = document.getElementById('notes-' + id).value.trim();
      const hint = document.querySelector('[data-notes-hint="' + id + '"]');
      if (hint) hint.textContent = mode === 'local' ? 'Saved' : 'Saving…';
      scheduleSave(300);
      return;
    }
    const ex = t.closest('[data-explain]');
    if (ex) {
      document.getElementById('tutor-lesson').value = ex.dataset.explain;
      document.getElementById('tutor').scrollIntoView({ block: 'start' });
      ask('explain');
      return;
    }
    if (t.closest('#tutor-ask')) ask('ask');
    else if (t.closest('#tutor-explain')) ask('explain');
    else if (t.closest('#tutor-stop') && tutorCtl) tutorCtl.abort();
  });

  /* ---------------- Start ---------------- */
  render();
  const savedScroll = ss((s) => s.getItem(SCROLL_KEY));
  if (savedScroll) {
    ss((s) => s.removeItem(SCROLL_KEY));
    requestAnimationFrame(() => window.scrollTo(0, Number(savedScroll) || 0));
  }

  (async () => {
    let api = null;
    try {
      api = window.claude && window.claude.use ? await window.claude.use('artifact') : null;
    } catch {
      api = null;
    }
    if (api) {
      artifactApi = api;
      mode = 'artifact';
      refresh();
      if (dirty) scheduleSave(600);
    } else {
      goLocal();
    }
  })();

  (async () => {
    let s = null;
    try {
      s = window.claude && window.claude.use ? await window.claude.use('sample') : null;
    } catch {
      s = null;
    }
    if (!s) return;
    sampleApi = s;
    document.getElementById('tutor').hidden = false;
    refresh();
  })();
</script>
